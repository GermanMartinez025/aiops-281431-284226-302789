# PodDisruptionBudgets: ante interrupciones voluntarias (kubectl drain, mantenimiento de nodos,
# upgrades del cluster) Kubernetes nunca deja a un componente de la aplicación sin réplicas disponibles.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pharmago-api-gateway-pdb
  namespace: pharmago
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pharmago-api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pharmago-users-service-pdb
  namespace: pharmago
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pharmago-users-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pharmago-pharmacy-service-pdb
  namespace: pharmago
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pharmago-pharmacy-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pharmago-ui-pdb
  namespace: pharmago
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pharmago-ui
