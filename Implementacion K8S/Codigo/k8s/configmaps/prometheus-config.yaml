apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    otlp:
      translation_strategy: UnderscoreEscapingWithSuffixes
      promote_resource_attributes:
        - service.name
        - service.instance.id
        - service.namespace
