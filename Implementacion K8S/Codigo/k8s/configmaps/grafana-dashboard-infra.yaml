apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infra
  namespace: pharmago
data:
  pharmago-infra.json: |
    {"title":"PharmaGo - Infra","uid":"pharmago-infra","tags":["pharmago","infra"],"time":{"from":"now-15m","to":"now"},"panels":[{"id":1,"title":"CPU de nodo (%)","type":"timeseries","gridPos":{"x":0,"y":0,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"100 - (avg by (node) (rate(node_cpu_seconds_total{node=~\"$node\",mode=\"idle\"}[5m])) * 100)","legendFormat":"{{node}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100,"decimals":2}},"description":"Porcentaje de CPU ocupado del nodo virtual de Minikube, calculado desde su tiempo idle de node-exporter con una tasa móvil de cinco minutos y el filtro Nodo."},{"id":2,"title":"Memoria de nodo usada (%)","type":"timeseries","gridPos":{"x":12,"y":0,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"(1 - (node_memory_MemAvailable_bytes{node=~\"$node\"} / node_memory_MemTotal_bytes{node=~\"$node\"})) * 100","legendFormat":"{{node}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100,"decimals":2}},"description":"Porcentaje de memoria usada en el nodo virtual de Minikube seleccionado: memoria total menos disponible, según node-exporter."},{"id":3,"title":"Filesystem observado usado (%)","type":"timeseries","gridPos":{"x":0,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"max by (node, mountpoint) ((1 - (node_filesystem_avail_bytes{node=~\"$node\",fstype!~\"tmpfs|overlay|squashfs\",mountpoint!~\"/etc/.*\"} / node_filesystem_size_bytes{node=~\"$node\",fstype!~\"tmpfs|overlay|squashfs\",mountpoint!~\"/etc/.*\"})) * 100)","legendFormat":"{{node}} {{mountpoint}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100,"decimals":2}},"description":"Porcentaje usado de los filesystems observados en el nodo virtual de Minikube seleccionado. Excluye tmpfs, overlay, squashfs y montajes bajo /etc; no representa un disco raíz que no esté exportado."},{"id":4,"title":"CPU por pod (pharmago)","type":"timeseries","gridPos":{"x":12,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (node,namespace,pod) (rate(container_cpu_usage_seconds_total{namespace=\"pharmago\",node=~\"$node\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[5m])) * 100","legendFormat":"{{node}} / {{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"decimals":2},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}},"description":"CPU agregada por pod en namespace pharmago. El valor está expresado como porcentaje de un núcleo; puede superar 100% cuando el pod usa más de un núcleo."},{"id":5,"title":"Memoria por pod (pharmago)","type":"timeseries","gridPos":{"x":0,"y":16,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (node,namespace,pod) (container_memory_working_set_bytes{namespace=\"pharmago\",node=~\"$node\",pod=~\"$pod\",container!=\"\",container!=\"POD\"})","legendFormat":"{{node}} / {{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}},"description":"Memoria working-set sumada para todos los contenedores del pod seleccionado en namespace pharmago; excluye contenedores vacíos y POD. El filtro Contenedor no modifica este panel."},{"id":6,"title":"Tráfico de red por nodo y dispositivo","type":"timeseries","gridPos":{"x":12,"y":16,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (node,device) (rate(node_network_receive_bytes_total{node=~\"$node\",device!~\"lo|veth.*|docker.*|cni.*|flannel.*|br-.*\"}[5m]))","legendFormat":"{{node}} {{device}} recibido","refId":"A"},{"expr":"sum by (node,device) (rate(node_network_transmit_bytes_total{node=~\"$node\",device!~\"lo|veth.*|docker.*|cni.*|flannel.*|br-.*\"}[5m]))","legendFormat":"{{node}} {{device}} enviado","refId":"B"}],"fieldConfig":{"defaults":{"unit":"Bps","min":0,"decimals":2},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}},"description":"Bytes recibidos y enviados por segundo en las interfaces observadas del nodo virtual de Minikube seleccionado. Las series se separan por nodo e interfaz y aplican los filtros configurados para loopback y dispositivos virtuales comunes."},{"id":7,"title":"CPU por contenedor (pharmago)","type":"timeseries","gridPos":{"x":0,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (node,namespace,pod,container) (rate(container_cpu_usage_seconds_total{namespace=\"pharmago\",node=~\"$node\",pod=~\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}[5m])) * 100","legendFormat":"{{node}} / {{pod}} / {{container}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"decimals":2},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}},"description":"CPU por contenedor en namespace pharmago. El valor está expresado como porcentaje de un núcleo; puede superar 100% cuando el contenedor usa más de un núcleo."},{"id":8,"title":"Memoria por contenedor (pharmago)","type":"timeseries","gridPos":{"x":12,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"container_memory_working_set_bytes{namespace=\"pharmago\",node=~\"$node\",pod=~\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}","legendFormat":"{{node}} / {{pod}} / {{container}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}},"description":"Memoria working-set por contenedor, filtrada por nodo, pod y contenedor seleccionados en el dashboard."}],"schemaVersion":38,"version":0,"templating":{"list":[{"name":"node","label":"Nodo","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(node_cpu_seconds_total, node)","refresh":1,"includeAll":true,"multi":false,"current":{"selected":true,"text":"All","value":".*"},"allValue":".*"},{"name":"pod","label":"Pod","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(container_memory_working_set_bytes{namespace=\"pharmago\",node=~\"$node\"}, pod)","refresh":1,"includeAll":true,"allValue":".*","multi":false,"current":{"selected":true,"text":"All","value":".*"}},{"name":"container","label":"Contenedor","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"query":"label_values(container_memory_working_set_bytes{namespace=\"pharmago\",node=~\"$node\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}, container)","refresh":1,"includeAll":true,"allValue":".*","multi":false,"current":{"selected":true,"text":"All","value":".*"}}]}}
