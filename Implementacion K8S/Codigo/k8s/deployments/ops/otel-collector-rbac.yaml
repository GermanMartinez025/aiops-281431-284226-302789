# Permisos del OpenTelemetry Collector para descubrir nodos y leer cAdvisor vía el API server
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: pharmago
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-metrics
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-metrics
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: pharmago
