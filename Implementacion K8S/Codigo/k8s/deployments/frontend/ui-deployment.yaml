apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-ui
  namespace: pharmago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharmago-ui
  template:
    metadata:
      labels:
        app: pharmago-ui
        pharmago.io/workload: application
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload-pool
                operator: In
                values: [application]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  pharmago.io/workload: application
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: dedicated
          operator: Equal
          value: application
          effect: NoSchedule
      containers:
      - name: pharmago-ui
        image: pharmago-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10

