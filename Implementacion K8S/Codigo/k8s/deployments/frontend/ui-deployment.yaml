apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-ui
  namespace: pharmago
spec:
  # Despliegue seguro: Rolling Update sin pérdida de capacidad
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pharmago-ui
  template:
    metadata:
      labels:
        app: pharmago-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [frontend, all]
      # Tiempo para drenar requests en curso antes de SIGKILL (preStop + apagado de la app)
      terminationGracePeriodSeconds: 30
      containers:
      - name: pharmago-ui
        # Espera a que el pod salga de los Endpoints del Service antes de recibir SIGTERM
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        image: pharmago-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10

