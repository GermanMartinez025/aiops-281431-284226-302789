apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-api-gateway
  namespace: pharmago
spec:
  # Despliegue seguro: Rolling Update sin pérdida de capacidad
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pharmago-api-gateway
  template:
    metadata:
      labels:
        app: pharmago-api-gateway
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [backend, all]
      # Tiempo para drenar requests en curso antes de SIGKILL (preStop + apagado de la app)
      terminationGracePeriodSeconds: 30
      containers:
      - name: pharmago-api-gateway
        # Espera a que el pod salga de los Endpoints del Service antes de recibir SIGTERM
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
        image: pharmago-api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        # Recursos reducidos para nodos ~5GB (proyecto docente)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        startupProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 15
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5

